<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FHEM Chat</title><style>body{font:16px system-ui;background:#101827;color:#edf3ff;max-width:850px;margin:auto;padding:20px}h1{font-size:24px}article,section{background:#1d2a40;border-radius:12px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap}textarea{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:10px}button{padding:12px 18px;margin:8px 8px 8px 0;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}#error{color:#ffb3ab}</style><h1>FHEM Chat</h1><p>Schreiben, nachfragen, einzeln freigeben.</p><button id="reset">Neuer Chat</button><main id="log"></main><section id="approval" hidden><h2>Auftrag prüfen</h2><pre id="proposal"></pre><p id="expiry"></p><button id="yes">Ausführen</button><button id="no">Abbrechen</button></section><p id="error" role="alert"></p><form id="form"><textarea id="text" maxlength="8000" required placeholder="Was soll ich tun?"></textarea><button id="send">Senden</button></form><script>
let pending=null,busy=false;
const el=id=>document.getElementById(id);
function render(s){el('log').replaceChildren();for(const m of s.messages){if(m.role==='tool'){const a=document.createElement('article');a.textContent='Werkzeug: '+m.content;el('log').append(a);continue}if(!m.content)continue;const a=document.createElement('article');a.textContent=(m.role==='user'?'Du: ':'Assistent: ')+m.content;el('log').append(a)}pending=s.pending;el('approval').hidden=!pending;if(pending){el('proposal').textContent=JSON.stringify(pending.action,null,2);el('expiry').textContent='Gültig bis '+new Date(pending.expires*1000).toLocaleTimeString()}el('send').disabled=!!pending||busy;el('text').disabled=!!pending||busy;el('yes').disabled=busy;el('no').disabled=busy}
async function request(path,data){if(busy)return;busy=true;el('send').disabled=true;el('yes').disabled=true;el('no').disabled=true;el('error').textContent='';try{const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-FHEM-Chat':'1'},body:JSON.stringify(data)}:{});const s=await r.json();if(!r.ok)throw Error(s.detail||'Anfrage fehlgeschlagen');busy=false;render(s)}catch(e){busy=false;el('error').textContent=e.message;el('send').disabled=!!pending;el('yes').disabled=false;el('no').disabled=false}}
el('reset').onclick=()=>{if(confirm('Verlauf dieses Web-Chats leeren und offene Freigabe verwerfen?'))request('/api/reset',{})};el('form').onsubmit=async e=>{e.preventDefault();const t=el('text').value.trim();if(t){await request('/api/chat',{text:t});el('text').value=''}};el('yes').onclick=()=>request('/api/decision',{id:pending.id,approve:true});el('no').onclick=()=>request('/api/decision',{id:pending.id,approve:false});request('/api/state');
</script></html>
